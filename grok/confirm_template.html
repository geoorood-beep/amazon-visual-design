<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>确认表</title>
<!--
  UTA style 确认表（给人看的版本）。
  写卡方只改下面 id 为 sheet 的那个 JSON 脚本块里的内容，页面其余部分原样不动。
  字段说明见 UTA_STYLE.md 2.2「给人看的确认表」。图片路径写仓库里的相对路径，页面自己拼 GitHub 地址。
-->
<style>
:root{
  --bg:#f6f2ec; --card:#fffdf9; --ink:#1f2630; --sub:#5d6673; --line:#e4ddd2;
  --chip:#efe8dc; --accent:#b4572e; --accent-soft:#f6e3d8; --ok:#2f7a4f; --warn:#a15c00; --warn-soft:#fbefd9;
  --dup:#c0392b; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#16181c; --card:#1f2228; --ink:#eceae6; --sub:#a3a9b3; --line:#30343c;
    --chip:#2a2e35; --accent:#e58a5c; --accent-soft:#3a2a22; --ok:#6fcf97; --warn:#f2b94b; --warn-soft:#3a3020; --dup:#ff7b6b;
    --shadow:none;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
header h1{font-size:26px;margin:0 0 4px;letter-spacing:.5px}
header .meta{color:var(--sub);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
h2{font-size:17px;margin:28px 0 10px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.mini b{font-size:14px}
.mini .dup{color:var(--dup);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden;display:grid;grid-template-columns:300px 1fr}
@media (max-width:760px){.card{grid-template-columns:1fr}}
.media{background:var(--chip);padding:12px;display:flex;flex-direction:column;gap:10px}
.media figure{margin:0}
.media img{width:100%;border-radius:10px;display:block;background:#ddd;aspect-ratio:1/1;object-fit:cover}
.media .small{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.media figcaption{font-size:12px;color:var(--sub);margin-top:4px}
.noimg{aspect-ratio:1/1;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:8px}
.body{padding:16px 18px 18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.slot{font-weight:800;font-size:20px}
.kind{color:var(--sub);font-size:13px}
.route{background:var(--ink);color:var(--card);border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:600}
.story{font-size:17px;line-height:1.65;margin:6px 0 4px}
.learn{color:var(--sub);font-size:13px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:8px;padding:3px 9px;font-size:13px}
.chip i{font-style:normal;color:var(--sub);margin-right:4px}
.chip.dup{outline:2px solid var(--dup)}
.must{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:13.5px;margin:6px 0}
.shot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
@media (max-width:520px){.shot{grid-template-columns:repeat(2,1fr)}}
.shot div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.shot span{display:block;color:var(--sub);font-size:11.5px}
.copy{border-left:4px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:12px}
.copy .eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase}
.copy .headline{font-size:22px;font-weight:800;line-height:1.25}
.copy .subtitle{color:var(--sub);margin-top:2px}
.copy .hero{display:inline-block;margin-top:6px;color:var(--accent);font-weight:800;font-size:20px}
.notes{margin:10px 0 0;padding-left:18px;color:var(--warn);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
.panel ul{margin:6px 0;padding-left:20px}
.panel.warn{background:var(--warn-soft);border-color:transparent}
.foot{margin-top:28px;text-align:center;color:var(--sub);font-size:14px}
.foot b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script id="sheet" type="application/json">
{
  "product": "示例产品",
  "title": "确认表",
  "step": "第 3 步 · 确认表",
  "style": "ST01 纪实电影风",
  "images": [
    {
      "slot": "S1", "kind": "副图", "fact": "F1", "selling": "示例卖点",
      "state": "装好", "lens": "标准", "effect": "", "must_show": "水从出水口流出，水面有波纹",
      "route": "R2 家庭生活时刻",
      "story": "一句中文故事：谁、什么时刻、什么情绪、卖点怎么被看见。",
      "learn": "学自 <案例文件名>，裂变：<改了什么>",
      "technique": "",
      "case": "", "product_ref": "",
      "scene": "SC03 客厅窗边地面", "pet": "PT02 橘色虎斑短毛猫", "expression": "EX01 专注喝水",
      "person": "", "mood": "",
      "shot": {"size": "中景", "camera": "低机位", "view": "正面", "light": "侧光"},
      "interaction": "", "foreground": "",
      "eyebrow": "", "headline": "Headline", "subtitle": "Subtitle", "hero": "",
      "notes": []
    }
  ],
  "set_checks": [],
  "adjustments": [],
  "customs": [],
  "unchecked": []
}
</script>

<script>
(function () {
  var RAW = "https://raw.githubusercontent.com/geoorood-beep/amazon-visual-design/main/";
  var data = JSON.parse(document.getElementById("sheet").textContent);
  var app = document.getElementById("app");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function url(p) { return !p ? "" : (/^https?:/.test(p) ? p : RAW + p.replace(/^\/+/, "")); }
  function code(s) { return String(s || "").split(/[ +]/)[0]; }
  function img(p, label, empty) {
    if (!p) return '<figure><div class="noimg">' + esc(empty) + '</div><figcaption>' + esc(label) + '</figcaption></figure>';
    return '<figure><img loading="lazy" src="' + esc(url(p)) + '" alt="' + esc(label) + '" onerror="this.outerHTML=\'<div class=noimg>图片读不到<br>' + esc(p) + '</div>\'"><figcaption>' + esc(label) + '</figcaption></figure>';
  }
  var imgs = data.images || [];
  // count repeats of scene and pet across the set so the human sees them at a glance
  var count = {};
  imgs.forEach(function (m) { ["scene", "pet"].forEach(function (k) { var c = code(m[k]); if (c && c !== "无") count[k + c] = (count[k + c] || 0) + 1; }); });
  function isDup(k, v) { var c = code(v); return c && count[k + c] > 1; }
  function chip(label, v, k) {
    if (!v) return "";
    return '<span class="chip' + (k && isDup(k, v) ? " dup" : "") + '"><i>' + label + '</i>' + esc(v) + '</span>';
  }

  var h = [];
  h.push('<header><h1>' + esc(data.product) + ' · ' + esc(data.title || "确认表") + '</h1><div class="meta">');
  h.push('<span class="pill">' + esc(data.step || "") + '</span>');
  if (data.style) h.push('<span>风格 <b>' + esc(data.style) + '</b></span>');
  h.push('<span>共 ' + imgs.length + ' 张</span><span>红框 = 整套里重复的场景或宠物</span></div></header>');

  h.push('<h2>整套一览</h2><div class="strip">');
  imgs.forEach(function (m, i) {
    h.push('<a class="mini" href="#c' + i + '"><b>' + esc(m.slot) + '</b> ' + esc(m.selling || "") + '<br>' +
      '<span class="' + (isDup("scene", m.scene) ? "dup" : "") + '">' + esc(m.scene || "—") + '</span><br>' +
      '<span class="' + (isDup("pet", m.pet) ? "dup" : "") + '">' + esc(m.pet || "无宠物") + '</span><br>' +
      esc(m.route || "") + '</a>');
  });
  h.push('</div>');

  if ((data.set_checks || []).length) {
    h.push('<h2>整套检查</h2><div class="panel"><ul>' + data.set_checks.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + '</ul></div>');
  }

  h.push('<h2>每张图</h2>');
  imgs.forEach(function (m, i) {
    var s = m.shot || {};
    h.push('<section class="card" id="c' + i + '"><div class="media">');
    h.push(img(m.case, "机位和构图参考（案例）", "无案例，自拟"));
    h.push('<div class="small">' + img(m.product_ref, "产品参考", "无产品参考") + '</div></div>');
    h.push('<div class="body"><div class="top"><span class="slot">' + esc(m.slot) + '</span><span class="kind">' + esc(m.kind || "") +
      (m.fact ? " · " + esc(m.fact) : "") + (m.selling ? " · " + esc(m.selling) : "") + '</span>' +
      (m.route ? '<span class="route">' + esc(m.route) + '</span>' : "") + '</div>');
    if (m.story) h.push('<div class="story">' + esc(m.story) + '</div>');
    var learn = [m.learn, m.technique ? "手法 " + m.technique : ""].filter(Boolean).join("；");
    if (learn) h.push('<div class="learn">' + esc(learn) + '</div>');
    if (m.must_show) h.push('<div class="must"><b>必须看得见：</b>' + esc(m.must_show) + '</div>');
    h.push('<div class="chips">' + chip("产品状态", m.state) + chip("镜头", m.lens) + chip("特效", m.effect) + chip("场景", m.scene, "scene") + chip("宠物", m.pet, "pet") + chip("表情", m.expression) +
      chip("人物", m.person) + chip("情绪", m.mood) + chip("互动", m.interaction) + chip("前景", m.foreground) + '</div>');
    h.push('<div class="shot"><div><span>景别</span>' + esc(s.size || "—") + '</div><div><span>机位</span>' + esc(s.camera || "—") +
      '</div><div><span>产品朝向</span>' + esc(s.view || "—") + '</div><div><span>光</span>' + esc(s.light || "—") + '</div></div>');
    if (m.headline || m.subtitle) {
      h.push('<div class="copy">' + (m.eyebrow ? '<div class="eyebrow">' + esc(m.eyebrow) + '</div>' : "") +
        '<div class="headline">' + esc(m.headline) + '</div>' +
        (m.subtitle ? '<div class="subtitle">' + esc(m.subtitle) + '</div>' : "") +
        (m.hero ? '<div class="hero">' + esc(m.hero) + '</div>' : "") + '</div>');
    }
    if ((m.notes || []).length) h.push('<ul class="notes">' + m.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + '</ul>');
    h.push('</div></section>');
  });

  [["adjustments", "我为满足整套规则自动调整了"], ["customs", "你的自定义怎么处理的"], ["unchecked", "还没核对的"]].forEach(function (p) {
    var list = data[p[0]] || [];
    if (list.length) h.push('<h2>' + p[1] + '</h2><div class="panel warn"><ul>' + list.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + '</ul></div>');
  });
  h.push('<div class="foot">看完回到对话里点 <b>确认</b>，或直接说要改哪一张的哪一项，例如「改 S3 场景」。</div>');
  app.innerHTML = h.join("");
  document.title = (data.product || "") + " 确认表";
})();
</script>
</body>
</html>
