<title>产品资料（选填）</title>
<!--

  样式和脚本从仓库加载；加载不出来时，最下面那段小脚本把要点列成纯文字，不挡流程。
  链接固定在某个提交号上：jsDelivr 不给超过 50 MB 的仓库按分支取文件。改了 grok/product_form.css 或 .js，
  先提交，再把下面两个链接里的提交号换成那次提交（tools/test_product_form.py 会查两边是否一致）。
  tools/product_form.py build 生成的文件会把样式和脚本嵌进页面，单独发出去也能用。
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/geoorood-beep/amazon-visual-design@5bc126e908ef4308d3a3fb7effde48db7aadcd04/grok/product_form.css" data-inline="grok/product_form.css">

  </div>
  <div class="in">
    <div class="count" id="count"></div>
    <button class="ghost" id="clear" type="button">清空我的修改</button>

<script>
window.addEventListener("load", function () {
  if (window.__utaProductFormLoaded) return;
  var d;
  try { d = JSON.parse(document.getElementById("sheet").textContent); } catch (err) { return; }
  function e(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  var h = "<h1>" + e(d.title || d.product) + "</h1><p>表单的样式和脚本没加载出来，下面是 AI 草稿的要点。判断题直接在对话里回答就行；不看也能往下做。</p>";
  (d.questions || []).forEach(function (q) { h += "<p><b>" + e(q.id + " " + q.text) + "</b><br>" + (q.options || []).map(e).join(" / ") + "</p>"; });
  if ((d.parts || []).length) h += "<p><b>部件</b><br>" + d.parts.map(function (p) { return e(p.id + " " + p.name + "（" + (p.type || "") + "，AI " + (p.conf || "") + "）"); }).join("<br>") + "</p>";
  document.getElementById("app").innerHTML = h;
  var bar = document.querySelector(".bar");
  if (bar) bar.style.display = "none";
});
